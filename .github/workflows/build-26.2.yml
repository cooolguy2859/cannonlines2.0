name: Build CannonLines 2.x for Minecraft 26.2

on:
  push:
    branches: [mc-26.2]
  pull_request:
    branches: [mc-26.2]
  workflow_dispatch:

jobs:
  build-26-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Migrate 1.21.11 Yarn sources to official Mojang names
        run: |
          cp migration/1.21.11/build.gradle build.gradle
          cp migration/1.21.11/gradle.properties gradle.properties
          gradle migrateMappings --mappings "net.minecraft:mappings:1.21.11" --overrideInputsIHaveABackup --no-daemon
          git checkout HEAD -- build.gradle gradle.properties
      - name: Build 26.2
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cannonlines-2x-26.2
          path: build/libs/*.jar
          if-no-files-found: error
